name: Check pinned GitHub Actions

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

jobs:
  check-pinned-actions:
    name: Scan for unpinned actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Scan for unpinned actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TARGETS=(".github/workflows")
          if [ -d ".github/actions" ]; then
            TARGETS+=(".github/actions")
          fi
          uvx "zizmor@1.29.0" --format=json-v1 --no-exit-codes "${TARGETS[@]}" > zizmor-results.json
          COUNT=$(jq '[.[] | select(.ident == "unpinned-uses")] | length' zizmor-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Found $COUNT unpinned GitHub Action reference(s). Pin all actions to a full 40-character commit SHA."
            jq '.[] | select(.ident == "unpinned-uses")' zizmor-results.json
            exit 1
          fi
          echo "No unpinned GitHub Actions found."
